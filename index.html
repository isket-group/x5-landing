<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İSKET GROUP — Многопрофильный холдинг: сопровождение поставщиков и решения для X5 Group</title>
    <!-- Подключаем современный фирменный шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-bg: #ffffff;      /* Светлая, чистая шапка */
            --header-text: #0f3822;    /* Глубокий темно-зеленый текст в шапке */
            --eco-primary: #00823d;    /* Сочный фирменный зеленый */
            --eco-hover: #006b32;      /* Темнее для наведения */
            --accent-red: #e31e24;     /* Акцентный красный */
            --bg-page: #f7faf8;        /* Очень светлый, легкий эко-фон страницы */
            --text-main: #2b3630;      /* Основной комфортный текст */
            --card-bg: #ffffff;        /* Белый фон карточек */
            --border-color: #e5ede8;   /* Мягкие аккуратные рамки */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { color: var(--text-main); line-height: 1.6; background-color: var(--bg-page); -webkit-font-smoothing: antialiased; overflow-x: hidden; width: 100%; }
        
        header { background: var(--header-bg); color: var(--header-text); padding: 14px 0; position: fixed; width: 100%; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border-bottom: 2px solid var(--border-color); }
        .container { width: 90%; max-width: 1180px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        
        /* Логотип */
        .logo { display: flex; align-items: center; text-decoration: none; color: #111; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; gap: 10px; }
        .logo-icon { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; }
        .logo-icon svg { width: 100%; height: 100%; fill: #111; }
        .logo-text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.5px; color: #111; }

        .header-right { display: flex; align-items: center; gap: 14px; }
        .status-btn { background: #f0f5f2; border: 1.5px solid #d2e3d9; color: var(--header-text); padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .status-btn:hover { background: var(--eco-primary); color: #fff; border-color: var(--eco-primary); }

        /* Кнопка переключения языка */
        .lang-switch { background: var(--eco-primary); color: #fff; border: none; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
        .lang-switch:hover { background: var(--eco-hover); }

        .phone-whatsapp { font-size: 14px; font-weight: 600; color: var(--header-text); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color 0.3s; white-space: nowrap; }
        .phone-whatsapp:hover { color: var(--eco-primary); }
        .whatsapp-tag { background: #25d366; color: #fff; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Плавающая кнопка WhatsApp */
        .floating-whatsapp { position: fixed; bottom: 25px; right: 25px; background: #25d366; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35); z-index: 1500; transition: transform 0.3s, background 0.3s; text-decoration: none; }
        .floating-whatsapp:hover { transform: scale(1.1); background: #20ba5a; }
        .floating-tooltip { position: absolute; right: 75px; background: #fff; color: #333; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,0.08); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.3s; border: 1px solid var(--border-color); }
        .floating-whatsapp:hover .floating-tooltip { opacity: 1; }

        /* Первый экран (Hero) */
        .hero { background: linear-gradient(135deg, #eaf4ef 0%, #f4f8f6 100%); color: var(--text-main); padding: 170px 0 90px 0; text-align: center; border-bottom: 3px solid var(--border-color); position: relative; }
        .hero h1 { font-size: 38px; font-weight: 800; margin-bottom: 20px; line-height: 1.2; letter-spacing: -0.5px; color: #0f3822; }
        .hero h1 span { color: var(--accent-red); }
        .hero p { font-size: 17px; font-weight: 400; margin-bottom: 35px; color: #4d5c53; max-width: 860px; margin-left: auto; margin-right: auto; padding: 0 10px; }
        
        /* Блок статистики */
        .stats-bar { display: flex; justify-content: center; gap: 50px; margin-top: 40px; padding-top: 30px; border-top: 1px solid #d2e3d9; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 28px; font-weight: 800; color: #0f3822; }
        .stat-num span { color: var(--accent-red); }
        .stat-desc { font-size: 13px; color: #63756a; margin-top: 4px; }

        .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--eco-primary); color: #fff; padding: 14px 24px; font-size: 15px; font-weight: 600; text-decoration: none; border-radius: 8px; transition: all 0.25s ease; border: none; cursor: pointer; text-align: center; box-shadow: 0 4px 15px rgba(0,130,61,0.2); width: 100%; }
        .btn:hover { background: var(--eco-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,130,61,0.3); }
        .btn-red { background: var(--accent-red); box-shadow: 0 4px 15px rgba(227,30,36,0.2); }
        .btn-red:hover { background: #c5161c; box-shadow: 0 6px 20px rgba(227,30,36,0.3); }
        
        /* Стили для заблокированной некликабельной кнопки «Скоро» */
        .btn-disabled { background: #e2e8e4; color: #788a7f; cursor: not-allowed; box-shadow: none; pointer-events: none; }

        section { padding: 75px 0; width: 100%; }
        .bg-light { background-color: #ffffff; }
        h2 { text-align: center; font-size: 30px; font-weight: 800; margin-bottom: 12px; color: #0f3822; letter-spacing: -0.5px; padding: 0 10px; }
        h2::after { content: ''; display: block; width: 45px; height: 4px; background: var(--accent-red); margin: 12px auto 35px auto; border-radius: 2px; }
        .section-subtitle { text-align: center; color: #63756a; font-size: 16px; margin-bottom: 40px; max-width: 750px; margin-left: auto; margin-right: auto; font-weight: 400; padding: 0 15px; }

        .directions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; max-width: 900px; margin: 0 auto; width: 100%; }
        .direction-card { background: var(--card-bg); padding: 35px 30px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.03); border: 1px solid var(--border-color); border-top: 5px solid var(--eco-primary); display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s ease; width: 100%; position: relative; }
        .direction-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        
        .card-icon { width: 48px; height: 48px; background: #eaf5ef; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 18px; }
        
        .direction-card h3 { font-size: 19px; font-weight: 700; color: #0f3822; margin-bottom: 10px; line-height: 1.3; }
        .direction-card p { color: #526359; font-size: 14px; margin-bottom: 20px; font-weight: 400; }
        .direction-badge { display: inline-block; background: #eaf5ef; color: var(--eco-primary); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Бейдж Новинка для Магнита */
        .badge-soon { position: absolute; top: 25px; right: 25px; }
        .tag-new { background: #fffbe6; color: #b45309; border: 1px solid #fef3c7; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }

        /* Блок Этапы работы (Roadmap) */
        .roadmap-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1180px; margin: 0 auto; width: 100%; }
        .roadmap-card { background: #fff; padding: 25px 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.02); position: relative; text-align: left; }
        .roadmap-num { font-size: 32px; font-weight: 800; color: var(--eco-primary); margin-bottom: 10px; opacity: 0.85; }
        .roadmap-card h4 { font-size: 16px; font-weight: 700; color: #0f3822; margin-bottom: 8px; }
        .roadmap-card p { font-size: 13px; color: #526359; }

        /* Блок "Почему выбирают İSKET GROUP" (Манифест) */
        .benefits-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; max-width: 1180px; margin: 0 auto; width: 100%; }
